[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-ai-cv"
version = "0.1.0"
description = "Independent RTSP computer-vision worker for CCTV AI Monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ultralytics>=8.4.0,<9.0",
  "lap>=0.5.12,<1.0",
  "torch>=2.14.0,<2.16",
  "opencv-python>=4.12.0,<5.0",
  "httpx>=0.28.1,<1.0",
  "pydantic>=2.12.0,<3.0",
  "pydantic-settings>=2.12.0,<3.0",
  "numpy>=2.2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
